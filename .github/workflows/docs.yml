name: Deploy documentation

# Builds the MkDocs site (architecture prose, guides, runbooks, the design
# record, and the mkdocstrings Python reference) and publishes it to GitHub
# Pages. Nothing built here is committed to the repo.
#
# Every step goes through `task` — scripts/check_ci_entrypoint.py fails the
# build if a step invokes uv/mkdocs/pytest/ruff/pyright directly.
#
# NOTE: GitHub Pages must be enabled in repo settings with
# Source: GitHub Actions. That is a one-time manual step this workflow
# cannot do for you.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Build docs site
        run: task docs:build -- "$RUNNER_TEMP/site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
