[project]
name = "rn-forge-agentkit"
version = "0.1.1"
description = "agent-agnostic setup and configuration for AI coding tools (Claude Code, Codex)"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "tomlkit>=0.15.0",
    "typer>=0.26.8",
]

[project.scripts]
agentkit = "rn_forge.agentkit:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
# Skill assets are templates copied verbatim into *other* repos, not code this
# package imports; they must not be held to this project's type strictness.
exclude = ["**/assets/skills/**", ".venv"]
ignore = ["tests"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
extend-exclude = ["**/assets/skills/**"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ALL"]

[tool.uv.build-backend]
module-name = "rn_forge.agentkit"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
    "pyyaml>=6.0",
]
