[project]
name = "rn-forge-agentkit"
version = "0.4.0"
description = "agent-agnostic setup and configuration for AI coding tools (Claude Code, Codex)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
# Deliberate, and not a technical floor: nothing in the source needs 3.14
# specifically. agentkit is a personal-toolchain CLI installed with `uv`, which
# fetches its own interpreter, so pinning to the newest release costs its users
# nothing and keeps the test matrix to one version. Widening it is a matter of
# lowering this bound and adding CI versions, not of back-porting code.
requires-python = ">=3.14"
keywords = ["ai", "agents", "claude", "codex", "configuration", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "tomlkit>=0.15.0",
    "typer>=0.26.8",
]

[project.urls]
Homepage = "https://github.com/rn-forge/agentkit"
Documentation = "https://rn-forge.github.io/agentkit/"
Repository = "https://github.com/rn-forge/agentkit"
Issues = "https://github.com/rn-forge/agentkit/issues"

[project.scripts]
agentkit = "rn_forge.agentkit:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
# Skill assets are templates copied verbatim into *other* repos, not code this
# package imports; they must not be held to this project's type strictness.
exclude = ["**/assets/skills/**", ".venv"]
ignore = ["tests"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
extend-exclude = ["**/assets/skills/**"]

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88
black = true

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ALL"]

[tool.uv.build-backend]
module-name = "rn_forge.agentkit"
# Belt-and-suspenders: these should never be present in a checkout to begin
# with, but macOS Finder metadata is not tracked by git and the backend does
# not exclude it by default, so a locally-built wheel can pick it up.
source-exclude = ["**/.DS_Store"]

[dependency-groups]
dev = [
    "docformatter>=1.7.8",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]
docs = [
    "mdformat>=1.0.0",
    "mdformat-front-matters>=2.0.0",
    "mdformat-mkdocs>=5.3.0",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
    "pyyaml>=6.0",
]
