[project]
name = "rn-forge-agentkit"
version = "0.1.0"
description = "agent-agnostic setup and configuration for AI coding tools (Claude Code, Codex)"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "rn-forge-commons[all]",
    "ruamel-yaml>=0.19.1",
    "tomlkit>=0.15.0",
    "typer>=0.26.8",
]

[project.scripts]
agentkit = "rn_forge.agentkit:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
ignore = ["tests"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ALL"]

[tool.uv.build-backend]
module-name = "rn_forge.agentkit"

[tool.uv.sources]
rn-forge-commons = { path = "../pykit/packages/rn-forge-commons" }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]
