sonar.projectKey=rn-forge_agentkit
sonar.projectName=agentkit
sonar.organization=rn-forge

sonar.sources=src
sonar.tests=tests

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# Skill/hook assets are templates copied verbatim into *other* repos, not code
# this package imports or exercises in its own tests (see pyright/ruff excludes
# in pyproject.toml for the same rationale).
sonar.coverage.exclusions=src/rn_forge/agentkit/assets/**
